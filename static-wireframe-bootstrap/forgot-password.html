<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="auth-box w-100" style="max-width: 420px;">
      <div class="auth-logo text-center mb-4">
        <img src="clinic-logo.png" alt="Ayag Dental Clinic" width="80" height="80" class="rounded-3 mb-3">
        <h1 class="h3 fw-bold mb-1">Ayag Dental Clinic</h1>
      </div>
      
<div class="card auth-card shadow">
  <div class="card-body p-4">
    <div class="text-center mb-3">
      <h2 class="h5 fw-semibold mb-1">Forgot Password</h2>
      <p class="text-muted small mb-0">Enter your email to receive a password reset code</p>
    </div>
    <form class="d-grid gap-3">
      <div>
        <label class="form-label small fw-medium">Email</label>
        <div class="input-group"><span class="input-group-text bg-white"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input class="form-control" type="email" placeholder="you@example.com"></div>
      </div>
      <button class="btn btn-brand w-100" type="button">Send Reset Code</button>
      <p class="text-center mb-0"><a href="login.html" class="small text-primary text-decoration-none">← Back to Login</a></p>
    </form>
  </div>
</div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
