<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Account - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="auth-box w-100" style="max-width: 420px;">
      <div class="auth-logo text-center mb-4">
        <img src="clinic-logo.png" alt="Ayag Dental Clinic" width="80" height="80" class="rounded-3 mb-3">
        <h1 class="h3 fw-bold mb-1">Ayag Dental Clinic</h1>
      </div>
      
<p class="text-center text-muted small mb-3" style="margin-top:-12px">Verify your account</p>
<div class="card auth-card shadow">
  <div class="card-body p-4">
    <div class="text-center mb-3">
      <div class="mx-auto mb-2 d-inline-flex align-items-center justify-content-center rounded-circle bg-info-subtle text-info" style="width:48px;height:48px"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <h2 class="h5 fw-semibold mb-1">Verify Your Account</h2>
      <p class="text-muted small mb-0">Enter the 6-digit code sent to your email</p>
    </div>
    <form class="d-grid gap-3" onsubmit="return false;">
      <div class="d-flex justify-content-center gap-2">
        <input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;"><input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;"><input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;"><input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;"><input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;"><input class="form-control otp-input text-center fw-semibold" type="text" maxlength="1" style="width:48px;height:48px;font-size:20px;">
      </div>
      <button class="btn btn-brand w-100" type="button" id="btn-verify">Verify Account</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-1">Didn't receive a code? <a href="#" class="text-primary text-decoration-none" id="resend-link">Resend Code</a></p>
    <p class="text-center small text-muted mb-0"><a href="register.html" class="text-primary text-decoration-none">← Back to Register</a></p>
  </div>
</div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
document.querySelectorAll('.otp-input').forEach((input, i, inputs) => {
  input.addEventListener('input', () => { if (input.value && i < inputs.length - 1) inputs[i + 1].focus(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus(); });
});
document.getElementById('btn-verify').addEventListener('click', () => {
  const code = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');
  if (code.length < 6) { showToast('Please enter the complete 6-digit code', 'warning'); return; }
  showToast('Verifying...', 'info');
  setTimeout(() => { showToast('Account verified successfully! Redirecting...', 'success'); setTimeout(() => { window.location.href = 'login.html'; }, 1500); }, 1000);
});
document.getElementById('resend-link').addEventListener('click', (e) => { e.preventDefault(); showToast('Verification code resent to your email!', 'success'); });
</script>
</body>
</html>
