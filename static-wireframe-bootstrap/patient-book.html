<head>

<body>
  <div class="layout d-flex">
    <aside class="sidebar d-flex flex-column" id="sidebar">
  <div class="sidebar-header d-flex align-items-center gap-2 p-3">
    <img src="clinic-logo.png" alt="Ayag Dental Clinic" width="36" height="36" class="rounded-3">
    <span class="fs-5 fw-bold">Ayag Dental</span>
  </div>
  <div class="sidebar-label px-3 pb-2">Menu</div>
  <ul class="nav nav-pills flex-column px-2 sidebar-menu">
    <li class="nav-item"><a class="nav-link " href="patient-dashboard.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Dashboard</span></a></li><li class="nav-item"><a class="nav-link active" href="patient-book.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg><span>Book Appointment</span></a></li><li class="nav-item"><a class="nav-link " href="patient-appointments.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>My Appointments</span></a></li><li class="nav-item"><a class="nav-link " href="patient-records.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Dental Records</span></a></li>
  </ul>
  <div class="sidebar-footer mt-auto p-3">
    <div class="sidebar-user p-3 rounded mb-2">
      <div class="small text-secondary-emphasis">Logged in as</div>
      <div class="fw-medium">John Smith</div>
      <div class="small text-secondary-emphasis">Patient</div>
    </div>
    <button class="btn btn-signout w-100 d-flex align-items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Sign Out</span></button>
  </div>
</aside>
    <div class="main-area flex-grow-1 d-flex flex-column">
      <header class="topbar d-flex align-items-center px-3 border-bottom bg-white">
  <button class="btn btn-link p-1 text-dark sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
</header>
      <main class="content flex-grow-1 p-4">
        
<div class="mb-4"><h1 class="h3 fw-bold mb-1">Book Appointment</h1><p class="text-muted mb-0">Schedule your next dental visit</p></div>
<div class="card"><div class="card-body">
  <div class="d-grid gap-3">
    <div><label class="form-label small fw-medium">Select Service</label><select class="form-select"><option>Choose a service</option><option>Orthodontics (Braces)</option><option>EXO (Bunot)</option><option>Restoration</option><option>Root Canal</option><option>Teeth Whitening</option><option>Fixed Bridge</option></select></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label small fw-medium">Preferred Date</label><input class="form-control" type="date"></div>
      <div class="col-md-6"><label class="form-label small fw-medium">Preferred Time</label><select class="form-select"><option>Select preferred time</option><option>Morning (9AM-12PM)</option><option>Afternoon (1PM-5PM)</option></select></div>
    </div>
    <div><label class="form-label small fw-medium">Available Dentist</label><select class="form-select"><option>Choose a dentist</option><option>Dr. Ayag</option><option>Dr. Santos</option><option>Dr. Reyes</option><option>Dr. Cruz</option></select></div>
    <div><label class="form-label small fw-medium">Available Time Slot</label><div class="time-slot-grid"><div class="time-slot available">9:00 AM</div><div class="time-slot available">9:30 AM</div><div class="time-slot selected">10:00 AM</div><div class="time-slot disabled">10:30 AM</div><div class="time-slot disabled">11:00 AM</div><div class="time-slot available">1:00 PM</div><div class="time-slot available">1:30 PM</div><div class="time-slot available">2:00 PM</div><div class="time-slot disabled">2:30 PM</div><div class="time-slot disabled">3:00 PM</div><div class="time-slot disabled">3:30 PM</div><div class="time-slot disabled">4:00 PM</div></div></div>
    <button class="btn btn-brand w-100 d-flex align-items-center justify-content-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Confirm Appointment</button>
  </div>
</div></div>

      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
