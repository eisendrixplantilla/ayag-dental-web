<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="clinic-logo.png" alt="Ayag Dental Clinic">
        <h1>Ayag Dental Clinic</h1>
      </div>
      <div class="card" style="box-shadow: var(--shadow-elevated)">
        <div class="card-header text-center">
          <h2 class="card-title" style="justify-content:center; font-size:20px;">Forgot Password</h2>
          <p class="card-description">Enter your email to receive a password reset code</p>
        </div>
        <div class="card-content">
          <form class="space-y-sm">
            <div>
              <label class="label">Email</label>
              <div class="input-icon">
                <span class="icon">✉</span>
                <input class="input" type="email" placeholder="you@example.com">
              </div>
            </div>
            <button class="btn btn-primary w-full" type="button">Send Reset Code</button>
            <p class="text-center">
              <a href="login.html" class="text-sm link">← Back to Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
