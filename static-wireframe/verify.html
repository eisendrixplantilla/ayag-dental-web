<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Account - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="clinic-logo.png" alt="Ayag Dental Clinic">
        <h1>Ayag Dental Clinic</h1>
        <p>Verify your account</p>
      </div>
      <div class="card" style="box-shadow: var(--shadow-elevated)">
        <div class="card-header text-center">
          <div style="margin:0 auto 8px; width:48px; height:48px; border-radius:50%; background:var(--secondary); display:flex; align-items:center; justify-content:center; font-size:24px;"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <h2 class="card-title" style="justify-content:center; font-size:20px;">Verify Your Account</h2>
          <p class="card-description">Enter the 6-digit code sent to your email</p>
        </div>
        <div class="card-content">
          <form class="space-y-sm" onsubmit="return false;">
            <div style="display:flex; justify-content:center; gap:8px;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
              <input class="input otp-input" type="text" maxlength="1" style="width:48px; height:48px; text-align:center; font-size:20px; font-weight:600;">
            </div>
            <button class="btn btn-primary w-full" type="button" id="btn-verify">Verify Account</button>
          </form>
          <p class="text-center text-sm text-muted mt-4">
            Didn't receive a code? <a href="#" class="link" id="resend-link">Resend Code</a>
          </p>
          <p class="text-center text-sm text-muted" style="margin-top:8px;">
            <a href="register.html" class="link">← Back to Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    // OTP auto-focus
    document.querySelectorAll('.otp-input').forEach((input, i, inputs) => {
      input.addEventListener('input', () => {
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
      });
    });

    // Verify button
    document.getElementById('btn-verify').addEventListener('click', () => {
      const code = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');
      if (code.length < 6) { showToast('Please enter the complete 6-digit code', 'warning'); return; }
      showToast('Verifying...', 'info');
      setTimeout(() => {
        showToast('Account verified successfully! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      }, 1000);
    });

    // Resend link
    document.getElementById('resend-link').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Verification code resent to your email!', 'success');
    });
  </script>
</body>
</html>
