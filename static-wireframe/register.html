<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="clinic-logo.png" alt="Ayag Dental Clinic">
        <h1>Ayag Dental Clinic</h1>
        <p>Create your account</p>
      </div>
      <div class="card" style="box-shadow: var(--shadow-elevated)">
        <div class="card-header text-center">
          <h2 class="card-title" style="justify-content:center; font-size:20px;">Get Started</h2>
          <p class="card-description">Fill in your details to create an account</p>
        </div>
        <div class="card-content">
          <form class="space-y-sm">
            <div>
              <label class="label">Full Name</label>
              <div class="input-icon">
                <span class="icon"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                <input class="input" placeholder="John Smith">
              </div>
            </div>
            <div>
              <label class="label">Email</label>
              <div class="input-icon">
                <span class="icon">✉</span>
                <input class="input" type="email" placeholder="you@example.com">
              </div>
            </div>
            <div>
              <label class="label">Password</label>
              <div class="input-icon">
                <span class="icon">🔒</span>
                <input class="input" type="password" placeholder="••••••••">
              </div>
            </div>
            <button class="btn btn-primary w-full" type="button">Create Account</button>
          </form>
          <p class="text-center text-sm text-muted mt-4">
            Already have an account? <a href="login.html" class="link">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
