<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Ayag Dental Clinic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header"><img src="clinic-logo.png" alt=""><span>Ayag Dental</span></div>
      <div class="sidebar-label">Menu</div>
      <ul class="sidebar-menu">
        <li><a href="patient-dashboard.html"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Dashboard</a></li>
        <li><a href="patient-book.html" class="active"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Book Appointment</a></li>
        <li><a href="patient-appointments.html"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> My Appointments</a></li>
        <li><a href="patient-records.html"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Dental Records</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="sidebar-user"><div class="label">Logged in as</div><div class="name">John Smith</div><div class="role">Patient</div></div>
        <button class="btn-signout"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign Out</button>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar"><span><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span></header>
      <main class="content space-y">
        <div><h1>Book Appointment</h1><p class="text-muted">Schedule your next dental visit</p></div>
        <div class="card">
          <div class="card-content space-y-sm">
            <div><label class="label">Select Service</label><select class="select"><option>Choose a service</option><option>Orthodontics (Braces)</option><option>EXO (Bunot)</option><option>Restoration</option><option>Root Canal</option><option>Teeth Whitening</option><option>Fixed Bridge</option></select></div>
            <div class="grid-2">
              <div><label class="label">Preferred Date</label><input class="input" type="date"></div>
              <div><label class="label">Preferred Time</label><select class="select"><option>Select preferred time</option><option>Morning (9AM-12PM)</option><option>Afternoon (1PM-5PM)</option></select></div>
            </div>
            <div><label class="label">Available Dentist</label><select class="select"><option>Choose a dentist</option><option>Dr. Ayag</option><option>Dr. Santos</option><option>Dr. Reyes</option><option>Dr. Cruz</option></select></div>
            <div>
              <label class="label">Available Time Slot</label>
              <div class="time-slot-grid">
                <div class="time-slot available">9:00 AM</div>
                <div class="time-slot available">9:30 AM</div>
                <div class="time-slot selected">10:00 AM</div>
                <div class="time-slot disabled">10:30 AM</div>
                <div class="time-slot disabled">11:00 AM</div>
                <div class="time-slot available">1:00 PM</div>
                <div class="time-slot available">1:30 PM</div>
                <div class="time-slot available">2:00 PM</div>
                <div class="time-slot disabled">2:30 PM</div>
                <div class="time-slot disabled">3:00 PM</div>
                <div class="time-slot disabled">3:30 PM</div>
                <div class="time-slot disabled">4:00 PM</div>
              </div>
            </div>
            <button class="btn btn-primary w-full"><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Confirm Appointment</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
